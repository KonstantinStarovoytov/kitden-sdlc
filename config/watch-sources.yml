- id: claude-code-changelog
  client: claude-code
  kind: page
  url: https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md
  level: 2
- id: codex-releases
  client: codex
  kind: github-releases
  repo: openai/codex
- id: cursor-changelog
  client: cursor
  kind: page
  url: https://cursor.com/changelog
  # One section per entry: each entry is an <article>, keyed by its title.
  split: article
# Agent Docs' list of every doc page it holds: once a week the watcher tells which doc pages
# of Kitden's list are not in it (scripts/watch_moved.py). It has no client and makes no piece.
- id: agent-docs-manifest
  kind: manifest
  url: https://raw.githubusercontent.com/KonstantinStarovoytov/agent-docs/main/data/manifests/agent_docs_hybrid_v1.json
# Agent Docs' feed of the doc pages it added and the sections it found new, for the last 14
# days: fetch makes pieces of the pages that touch Kitden (scripts/watch_feed.py and plan_feed
# in scripts/watch_fetch.py). It has no client: each page's client comes from its address.
- id: agent-docs-feed
  kind: feed
  url: https://raw.githubusercontent.com/KonstantinStarovoytov/agent-docs/main/reports/docs-changes/feed.json
