<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Lantern, the review and issues app: a lantern that lights up what it checked. Its glass
       holds a shield with a check: it reads, and it only comments. -->
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F3236"/>
      <stop offset="1" stop-color="#172428"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFD27A" stop-opacity=".45"/>
      <stop offset=".6" stop-color="#FFB454" stop-opacity=".1"/>
      <stop offset="1" stop-color="#FFB454" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC56B"/>
      <stop offset="1" stop-color="#FFA94A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#teal)"/>
  <circle cx="256" cy="290" r="230" fill="url(#halo)"/>
  <!-- ring -->
  <circle cx="256" cy="86" r="30" fill="none" stroke="#C85835" stroke-width="18"/>
  <!-- cap -->
  <path fill="#C85835" d="M200 132h112c5 0 9 4 9 9v8H191v-8c0-5 4-9 9-9Z"/>
  <path fill="#C85835" d="M176 196l22-46h116l22 46Z"/>
  <rect x="160" y="190" width="192" height="22" rx="9" fill="#C85835"/>
  <!-- glass with the shield and check -->
  <rect x="186" y="212" width="140" height="176" fill="url(#glass)"/>
  <path fill="#FFF3CF" d="M256 236l52 18v40c0 34-22 58-52 70-30-12-52-36-52-70v-40Z"/>
  <path fill="none" stroke="#C85835" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" d="M232 300l18 18 34-36"/>
  <!-- frame posts -->
  <rect x="170" y="206" width="22" height="188" rx="8" fill="#C85835"/>
  <rect x="320" y="206" width="22" height="188" rx="8" fill="#C85835"/>
  <!-- base -->
  <rect x="160" y="388" width="192" height="24" rx="9" fill="#C85835"/>
  <rect x="140" y="410" width="232" height="30" rx="12" fill="#C85835"/>
</svg>
