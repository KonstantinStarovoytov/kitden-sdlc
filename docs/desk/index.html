<style>
/* The map's look (docs/map/index.html): one framed window on the out colour, a rail on the
   left, neutral panels with fine solid lines, 6px lamps for state. Light and dark. */
:root{
  --brand:#c85835; --out:#e4e7ec; --canvas:#f5f6f8; --panel:#ffffff; --raised:#ffffff; --inset:#f0f2f5;
  --ink:#161a21; --ink-2:#464d5b; --ink-3:#626977; --wire:#e1e4e9; --link:#c3c8d0;
  --route:#a44226; --route-soft:#f6e8e2;
  --lamp-on:#1c8a4c; --lamp-warn:#97590a; --lamp-bad:#c23a2b; --lamp-off:#80868f;
  --warn-soft:#fbf1e2; --bad-soft:#fbe7e4;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --out:#0d0f13; --canvas:#171a20; --panel:#20242c; --raised:#282d36; --inset:#12151a;
  --ink:#f2f3f5; --ink-2:#c1c6cf; --ink-3:#a5adba; --wire:#3b424d; --link:#59616f;
  --route:#f09a7c; --route-soft:#382a27;
  --lamp-on:#47c27a; --lamp-warn:#eac27c; --lamp-bad:#f07a6a; --lamp-off:#707886;
  --warn-soft:#352c1d; --bad-soft:#3a2321; color-scheme:dark } }
:root[data-theme="dark"]{
  --out:#0d0f13; --canvas:#171a20; --panel:#20242c; --raised:#282d36; --inset:#12151a;
  --ink:#f2f3f5; --ink-2:#c1c6cf; --ink-3:#a5adba; --wire:#3b424d; --link:#59616f;
  --route:#f09a7c; --route-soft:#382a27;
  --lamp-on:#47c27a; --lamp-warn:#eac27c; --lamp-bad:#f07a6a; --lamp-off:#707886;
  --warn-soft:#352c1d; --bad-soft:#3a2321; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--out);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
[hidden]{display:none!important}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
h1{font-size:28px;font-weight:700} h2{font-size:17px;font-weight:600} h3{font-size:13px;font-weight:600}
p{margin:0;max-width:76ch}
a{color:var(--route);text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--route);outline-offset:2px;border-radius:5px}
code{font-family:var(--mono);font-size:.9em;background:var(--inset);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.ink2{color:var(--ink-2)} .ink3{color:var(--ink-3)} .cap{font-size:11px;font-weight:600;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

.shell{padding:16px}
.app{max-width:1240px;margin:0 auto;background:var(--canvas);border:1px solid var(--wire);border-radius:12px;display:grid;grid-template-columns:164px minmax(0,1fr);overflow:hidden;min-height:calc(100vh - 32px)}
.rail{border-right:1px solid var(--wire);padding:16px 10px;display:flex;flex-direction:column;gap:18px}
.word{display:flex;align-items:center;gap:8px;padding:0 6px;font-weight:650;font-size:15px;letter-spacing:-.02em}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav a{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;font-size:13px;color:var(--ink-2);text-decoration:none;position:relative}
.rail nav a svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail nav a:hover{background:var(--inset)}
.rail nav a[aria-current="page"]{background:var(--route-soft);color:var(--route);font-weight:500}
.rail nav a[aria-current="page"]::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--brand)}
.rail .back{display:flex;white-space:nowrap;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;font-size:13px;color:var(--ink-2);text-decoration:none}
.rail .back:hover{background:var(--inset);color:var(--ink)}
.rail .back svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail .foot{margin-top:auto;font-size:11px;color:var(--ink-3);padding:0 6px;line-height:1.45}
.main{padding:26px 28px 32px;display:flex;flex-direction:column;gap:22px;min-width:0}

.lamp{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:var(--lamp-off)}
.lamp.green{background:var(--lamp-on)} .lamp.amber{background:var(--lamp-warn)} .lamp.red{background:var(--lamp-bad)}
.lamp.grey{background:transparent;box-shadow:inset 0 0 0 1.5px var(--lamp-off)}
.lamp.big{width:12px;height:12px}
.lamp.amber.big,.lamp.red.big{box-shadow:0 0 0 4px color-mix(in srgb,currentColor 0%,transparent)}

.head{display:flex;flex-direction:column;gap:8px}
.head h1{display:flex;align-items:center;gap:12px}
.lede{color:var(--ink-2)}
.note{border:1px solid var(--wire);border-radius:8px;padding:10px 12px;font-size:13px;background:var(--panel)}
.note.amber{background:var(--warn-soft);border-color:color-mix(in srgb,var(--lamp-warn) 45%,var(--wire))}
.note.red{background:var(--bad-soft);border-color:color-mix(in srgb,var(--lamp-bad) 45%,var(--wire))}

section{display:flex;flex-direction:column;gap:10px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--wire);border-radius:10px;min-width:0}
.pad{padding:14px 16px;display:flex;flex-direction:column;gap:10px}

.lights{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.light{border:1px solid var(--wire);border-radius:8px;padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.light .t{display:flex;align-items:center;gap:8px;font-weight:600}
.light .t .w{margin-left:auto;font-size:11px;font-weight:600;color:var(--ink-3)}
.light.amber{background:var(--warn-soft)} .light.red{background:var(--bad-soft)}
.light .c{font-size:12px;color:var(--ink-3)}
.light .y{font-size:12.5px;color:var(--ink)}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.items li{padding:10px 16px;border-top:1px solid var(--wire);display:flex;flex-direction:column;gap:3px;font-size:13px}
ul.items li:first-child{border-top:0}
ul.items .k{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;line-height:1;padding:4px 7px;border-radius:6px;border:1px solid var(--wire);color:var(--ink-2);background:var(--canvas);white-space:nowrap}
.empty{padding:14px 16px;color:var(--ink-3);font-size:13px}
.sub{font-size:12px;color:var(--ink-3)}
ul.failed{margin:2px 0 0;padding-left:18px;font-size:12px;color:var(--ink-2)}
ul.items ul.failed li{display:list-item;padding:0;border:0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.stat{border:1px solid var(--wire);border-radius:8px;padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat b.none{font-size:13px;font-weight:500;color:var(--ink-3);padding:6px 0}

.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:8px 12px;border-bottom:1px solid var(--wire);text-align:right;vertical-align:top}
th{font-size:11px;font-weight:600;color:var(--ink-3)}
th:first-child,td:first-child{text-align:left}
td.text,th.text{text-align:left}
tr:last-child td{border-bottom:0}
td{font-variant-numeric:tabular-nums}
ul.links{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.small{font-size:11.5px;color:var(--ink-3)}
.loading{color:var(--ink-3)}

@media (max-width:860px){
  .shell{padding:0}
  .app{grid-template-columns:1fr;border-radius:0;border:0;min-height:100vh}
  .rail{border-right:0;border-bottom:1px solid var(--wire);flex-direction:row;align-items:center;gap:10px;padding:10px 16px;overflow-x:auto}
  .rail nav{flex-direction:row} .rail nav a{white-space:nowrap} .rail nav a[aria-current="page"]::before{display:none}
  .rail .foot{display:none} .main{padding:18px 16px 24px}
  .two{grid-template-columns:1fr}
}
</style>
</head>

<script type="module">
import { view, usagePages, ticks, DATA, ROSTER, DATA_PAGE, HOW_TO, RUNS } from './view.js';

const main = document.getElementById('main');

// Every piece goes in as text. A piece: a string, {code}, {text, href}, or a list of them.
function put(el, piece) {
  if (piece === null || piece === undefined || piece === '') return el;
  if (Array.isArray(piece)) { piece.forEach(p => put(el, p)); return el; }
  if (piece instanceof Node) { el.append(piece); return el; }
  if (typeof piece === 'string') { el.append(document.createTextNode(piece)); return el; }
  if ('code' in piece) { el.append(make('code', {}, piece.code)); return el; }
  if ('href' in piece) { el.append(make('a', { href: piece.href, rel: 'noopener noreferrer' }, piece.text)); return el; }
  el.append(document.createTextNode(String(piece.text ?? '')));
  return el;
}
function make(tag, attrs = {}, ...pieces) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== undefined && v !== null) el.setAttribute(k, v);
  pieces.forEach(p => put(el, p));
  return el;
}
const lamp = (s, big) => make('span', { class: `lamp ${s}${big ? ' big' : ''}`, 'aria-hidden': 'true' });
function section(title, ...children) {
  const s = make('section', {}, make('h2', {}, title));
  children.flat().filter(Boolean).forEach(c => s.append(c));
  return s;
}
function grid(t) {
  if (!t) return null;
  const wrap = make('div', { class: 'tscroll' });
  const table = make('table');
  // A column of numbers (or "—") lines up on the right; any other on the left.
  const numeric = t.head.map((_, i) => i > 0 && t.rows.every(r => /^[\d,.]+$|^—$/.test(r[i])));
  const tr = make('tr'); t.head.forEach((h, i) => tr.append(make('th', { scope: 'col', class: numeric[i] ? undefined : 'text' }, h)));
  table.append(make('thead'), make('tbody'));
  table.tHead.append(tr);
  t.rows.forEach(r => {
    const row = make('tr');
    r.forEach((c, i) => row.append(make('td', { class: numeric[i] ? undefined : 'text' }, c)));
    table.tBodies[0].append(row);
  });
  wrap.append(table);
  return wrap;
}
const missing = t => (t && t.missing.length ? make('p', { class: 'sub' }, `Not measured yet: ${t.missing.join(', ')}.`) : null);

function render(v) {
  const lead = document.getElementById('lead');
  lead.replaceChildren(lamp(v.overall, true), make('span', {}, v.lead));
  const read = document.getElementById('read');
  read.className = 'lede';
  read.replaceChildren(...[`Numbers read at ${v.updated}, from `, make('a', { href: DATA_PAGE }, 'desk.json'),
    '. The desk counts them every day at 06:41 UTC.'].map(p => (typeof p === 'string' ? document.createTextNode(p) : p)));
  main.querySelectorAll('section, .note').forEach(e => e.remove());

  const notes = [];
  if (v.old) notes.push(make('p', { class: 'note amber' }, 'These numbers are more than a day old: the desk\'s last run may have failed. ',
    { text: 'Look at its runs', href: RUNS }, '.'));
  if (v.map) notes.push(make('p', { class: 'note' }, ticks(v.map)));

  const lights = make('div', { class: 'lights' });
  v.lights.forEach(l => lights.append(make('div', { class: `light ${l.state}` },
    make('div', { class: 't' }, lamp(l.state), l.name, make('span', { class: 'w' }, l.word)),
    l.checks.length ? make('div', { class: 'c' }, 'Checks that ', l.checks) : '',
    l.why.length ? make('div', { class: 'y' }, l.why) : '')));
  if (!v.lights.length) lights.append(make('p', { class: 'empty' }, 'No lights in desk.json.'));

  const wait = make('div', { class: 'panel' });
  if (v.waiting === null) wait.append(make('p', { class: 'empty' }, 'Not measured.'));
  else if (!v.waiting.length) wait.append(make('p', { class: 'empty' }, 'Nothing waits for you.'));
  else {
    const ul = make('ul', { class: 'items' });
    v.waiting.forEach(i => ul.append(make('li', {},
      make('div', { class: 'k' }, make('span', { class: 'chip' }, i.kind), make('span', {}, i.title)),
      i.do.length || i.days ? make('div', { class: 'sub' }, i.do, i.do.length && i.days ? ' ' : '', i.days) : '')));
    wait.append(ul);
  }

  const night = make('div', { class: 'panel' });
  if (v.nightly === null) night.append(make('p', { class: 'empty' }, `Nightly runs: not measured yet.`));
  else if (!v.nightly.length) night.append(make('p', { class: 'empty' }, 'No nightly job is expected.'));
  else {
    const ul = make('ul', { class: 'items' });
    v.nightly.forEach(p => {
      const li = make('li', {},
        make('div', { class: 'k' }, lamp(p.state), make('b', {}, p.part),
          make('span', { class: 'ink3' }, p.workflow), make('span', { class: 'chip' }, p.word)),
        make('div', { class: 'sub' }, p.run ? { text: p.night, href: p.run } : p.night, p.note ? ` · ${p.note}` : ''));
      if (p.means) li.append(make('div', {}, p.means));
      if (p.failed.length) {
        const f = make('ul', { class: 'failed' });
        p.failed.forEach(j => f.append(make('li', {}, j.job, `: ${j.step}`)));
        li.append(f);
      }
      ul.append(li);
    });
    night.append(ul);
  }
  night.append(make('p', { class: 'empty' }, v.setAside === null ? 'Tests set aside: not measured yet.'
    : ['Tests set aside: ', `${v.setAside} `, '(', { text: 'tests/set-aside.txt', href: v.setAsideUrl }, ').']));

  const stats = make('div', { class: 'stats' });
  v.use.forEach(u => stats.append(make('div', { class: 'stat' }, make('span', { class: 'cap' }, u.label),
    u.value === null ? make('b', { class: 'none' }, 'not measured yet') : make('b', {}, u.value),
    make('span', { class: 'sub' }, u.note))));

  const weekPad = make('div', { class: 'panel pad' }, make('p', { class: 'sub' }, v.weekNote));
  if (v.week) weekPad.append(grid(v.week), ...[missing(v.week)].filter(Boolean),
    make('p', { class: 'sub' }, 'Runs: runs that ended, well or badly; the two reviewers share one per push. Failed: those that failed. Did: pull requests reviewed, issues opened or release pull requests opened. No answer: review comments in which that reviewer gave none. Agreed and disagreed: your 👍 and 👎 on a review, or ',
      { code: 'confirmed' }, ' and ', { code: 'false-alarm' }, ' on the watcher\'s issues.'));
  else weekPad.append(make('p', {}, 'The agents\' week: not measured yet.'));
  weekPad.append(make('p', {}, v.review));

  const found = make('div', { class: 'panel pad' }, make('p', { class: 'sub' },
    'By month. Review: findings fixed before the merge. Nightly: ', { code: 'ci-failure' },
    ' issues the desk opened for a red nightly test job. Watcher: confirmed client changes. You and Others: bugs opened.'));
  if (v.foundBy) found.append(grid(v.foundBy), ...[missing(v.foundBy)].filter(Boolean));
  else found.append(make('p', {}, 'Who found problems: not measured yet.'));
  if (v.misses === null) found.append(make('p', {}, 'Misses: not measured yet.'));
  else if (!v.misses.length) found.append(make('p', {}, 'No misses in the last 30 days.'));
  else {
    const ul = make('ul', { class: 'links' });
    v.misses.forEach(m => ul.append(make('li', {}, m)));
    found.append(make('p', {}, 'Misses: bugs opened in the last 30 days that a reviewed pull request caused.'), ul);
  }

  const money = make('div', { class: 'panel pad' });
  money.append(v.budget.caps ? make('h3', {}, 'Each agent\'s runs in the last 7 days, and its cap') : make('p', {}, 'No agent is listed.'));
  if (v.budget.caps) money.append(grid(v.budget.caps));
  money.append(v.budget.keys ? make('h3', {}, 'The keys the agents use') : make('p', {}, 'No key is listed.'));
  if (v.budget.keys) money.append(grid(v.budget.keys), ...[missing(v.budget.keys)].filter(Boolean));
  money.append(make('p', { class: 'sub' }, 'The providers enforce the money caps; no billing key is stored.'));

  const links = make('ul', { class: 'links' });
  v.links.forEach(l => links.append(make('li', {}, l)));

  main.append(...notes,
    section('Lights', lights),
    make('div', { class: 'two' }, section('Waiting for you', wait), section('Nightly tests', night)),
    section('Use', stats),
    section('This week', weekPad),
    section('Who found problems', found),
    section('Budget', money),
    section('Links', make('div', { class: 'panel pad' }, links)),
    make('section', {}, make('p', { class: 'small' }, 'What each light means and what to do: ',
      { text: 'docs/owner.md', href: HOW_TO }, '. Made from desk.json by this page; no model wrote it.')));
}

function fail(why) {
  const read = document.getElementById('read');
  read.className = 'lede';
  read.replaceChildren(document.createTextNode(`Could not read desk.json (${why}). `),
    make('a', { href: DATA_PAGE }, 'Open it on GitHub'), document.createTextNode('.'));
}

async function json(url) {
  const r = await fetch(url, { cache: 'no-cache', credentials: 'omit', referrerPolicy: 'no-referrer' });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

const theme = new URLSearchParams(location.search).get('theme');
if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
// For a look at other data in the browser's console: renderDesk(desk).
window.renderDesk = (desk, now = new Date(), usage = new Set()) => render(view(desk, now, usage));

const roster = json(ROSTER).then(usagePages, () => new Set());
json(DATA).then(async desk => render(view(desk, new Date(), await roster)))
  .catch(e => fail(e instanceof SyntaxError ? 'not JSON' : e.message || 'no answer'));
</script>
</body>
</html>
