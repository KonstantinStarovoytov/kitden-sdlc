<!doctype html>
<!-- The site's front door: the two pages of kitden-sdlc. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kitden-sdlc</title>
<style>
:root{--out:#e4e7ec;--panel:#ffffff;--ink:#161a21;--ink-3:#626977;--wire:#e1e4e9;--route:#a44226;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--out:#0d0f13;--panel:#20242c;--ink:#f2f3f5;--ink-3:#a5adba;--wire:#3b424d;--route:#f09a7c;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--out);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding:16px;box-sizing:border-box}
main{background:var(--panel);border:1px solid var(--wire);border-radius:12px;padding:24px 28px;max-width:420px;width:100%}
h1{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}
p{margin:0 0 16px;color:var(--ink-3);font-size:13px}
ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
a{color:var(--route);font-weight:600;text-underline-offset:3px}
span{display:block;color:var(--ink-3);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>kitden-sdlc</h1>
  <p>The GitHub workflows around Kitden.</p>
  <ul>
    <li><a href="desk/">Desk</a><span>Kitden's health and what waits for the owner, from today's numbers.</span></li>
    <li><a href="map/">Map</a><span>Every workflow, what starts it, its jobs and their steps.</span></li>
  </ul>
</main>
</body>
</html>
