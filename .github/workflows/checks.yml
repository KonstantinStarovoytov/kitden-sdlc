name: checks

on: [push, pull_request]

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.10"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python scripts/check_agent_workflows.py .github/workflows
      # Our own settings, not the ones a pull request brings.
      - run: uvx --no-config zizmor==1.32.0 --no-config --no-ignores .github/workflows
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -config-file config/actionlint.yaml
