name: Luna review

# Reusable workflow: a pull request in the calling repository gets a review from
# GPT-6 Luna through OpenAI's Codex action. The caller decides when it runs
# (see the `if` it must carry).

on:
  workflow_call:
    inputs:
      daily_cap:
        type: number
        default: 10
    secrets:
      openai_api_key:
        required: true

permissions: {}

jobs:
  # Stop when this workflow has already run too often today.
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # list today's runs
    outputs:
      skip: ${{ steps.count.outputs.skip }}
    steps:
      - id: count
        env:
          GH_TOKEN: ${{ github.token }}
          DAILY_CAP: ${{ inputs.daily_cap }}
          RUN_ID: ${{ github.run_id }}
        # Today's other runs that did or do work: cancelled and skipped runs do not count,
        # runs still going do. This run is left out, so at the cap it stops.
        run: |
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$GITHUB_WORKFLOW" \
            --created ">=$(date -u +%F)" --limit 100 --json databaseId,conclusion,status \
            --jq '[.[] | select((.databaseId | tostring) != env.RUN_ID
              and .conclusion != "cancelled" and .conclusion != "skipped")] | length')"
          echo "Runs today before this one: $runs (cap $DAILY_CAP)"
          if [ "$runs" -ge "$DAILY_CAP" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: cap
    if: needs.cap.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
      pull-requests: read # read the diff and the description
    outputs:
      findings: ${{ steps.luna.outputs.final-message }}
    steps:
      # Without these two the checkout below would fall back to the pull request's code.
      - name: Make sure this workflow knows its own commit
        env:
          WORKFLOW_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPO" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty"
            exit 1
          fi
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pull request could commit .kitden-sdlc as a link; checkout would follow it.
      - name: Clear the plugin folder
        run: rm -rf .kitden-sdlc
      # This workflow's own repository, at the commit this workflow file comes from.
      # `job.workflow_*` names the called workflow, not the caller.
      - name: Check out kitden-sdlc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .kitden-sdlc
          persist-credentials: false
      - name: Collect the files to review
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: .kitden-sdlc/scripts/prepare_review.sh "$PR_NUMBER" "$BASE_REF"
      # Codex reads AGENTS.md, .agents and .codex files from the checkout as its own
      # instructions. The pull request controls them, so delete them. The base branch's
      # AGENTS.md is in .review, and the pull request's change is in .review/diff.patch.
      - name: Remove the pull request's agent instructions
        if: steps.prepare.outputs.skip != 'true'
        run: |
          rm -rf AGENTS.md AGENTS.override.md .agents .codex
          find . \( -path ./.git -o -path ./.review -o -path ./.kitden-sdlc \) -prune -o \( -name AGENTS.md -o -name AGENTS.override.md \) \( -type f -o -type l \) -print -exec rm -f {} +
      # Only a too-large change has a findings file at this point: the script wrote it,
      # and the model has not run yet. The post job posts it.
      - name: Keep the findings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-luna
          path: .review/findings.json
          include-hidden-files: true
          if-no-files-found: ignore
      # Last step of the job: the action drops sudo for the rest of the job.
      # `drop-sudo` (the default) keeps the OpenAI key out of the model's reach; the
      # read-only profile means no writes and no network, so the findings come back as
      # the final message. Web search is off. The earlier step deletes the pull
      # request's agent files, and project_doc_max_bytes=0 asks Codex to read no
      # project instructions as well.
      - name: Review
        id: luna
        if: steps.prepare.outputs.skip != 'true'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        with:
          openai-api-key: ${{ secrets.openai_api_key }}
          codex-version: "0.167.0"
          model: gpt-6-luna
          prompt-file: .kitden-sdlc/prompts/review-luna.md
          output-schema-file: .kitden-sdlc/schemas/findings.openai.schema.json
          permission-profile: ":read-only"
          codex-args: '["-c", "project_doc_max_bytes=0", "-c", "web_search=\"disabled\""]'

  post:
    needs: review
    if: always() && needs.review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # post the comments
    steps:
      # Without these two the checkout below would fall back to the pull request's code.
      - name: Make sure this workflow knows its own commit
        env:
          WORKFLOW_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPO" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty"
            exit 1
          fi
      - name: Check out kitden-sdlc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      # Only present when the change was too large to review.
      - name: Get the too-large notice
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: findings-luna
      # The model's answer is text from outside: it goes through env, never into the script.
      # No answer and no notice: post_findings.py says the reviewer gave no usable answer.
      - name: Save the findings
        env:
          FINDINGS: ${{ needs.review.outputs.findings }}
        run: |
          if [ -n "$FINDINGS" ]; then
            printf '%s' "$FINDINGS" > findings.json
          fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.10"
      - name: Post the findings
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          uv run --no-project python scripts/post_findings.py --report findings.json
          --repo "$REPO" --pr "$PR_NUMBER" --head-sha "$HEAD_SHA"
          --reviewer luna --model gpt-6-luna
