name: Agent review

# Reusable workflow: a pull request in the calling repository gets one review comment.
# Claude and GPT-6 Luna (through OpenAI's Codex action) each read the change, and a job
# without a model puts their findings into that one comment. The caller decides when
# it runs (see the `if` it must carry) and passes Claude's model.

on:
  workflow_call:
    inputs:
      model:
        type: string
        required: true
      max_turns:
        type: number
        default: 30
      daily_cap:
        type: number
        default: 10
      # A GitHub App that posts the comment under its own name. Empty: the job's token posts.
      app_client_id:
        type: string
        default: ""
    secrets:
      claude_code_oauth_token:
        required: true
      openai_api_key:
        required: true
      app_private_key:
        required: false

permissions: {}

jobs:
  # Stop when this workflow has already run too often today.
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # list today's runs
    outputs:
      skip: ${{ steps.count.outputs.skip }}
    steps:
      - id: count
        env:
          GH_TOKEN: ${{ github.token }}
          DAILY_CAP: ${{ inputs.daily_cap }}
          RUN_ID: ${{ github.run_id }}
        # Today's other runs that did or do work: cancelled and skipped runs do not count,
        # runs still going do. This run is left out, so at the cap it stops.
        run: |
          # The caller's file name: a workflow's name can change, its file does not.
          file="${GITHUB_WORKFLOW_REF%@*}"
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "${file##*/}" \
            --created ">=$(date -u +%F)" --limit 100 --json databaseId,conclusion,status \
            --jq '[.[] | select((.databaseId | tostring) != env.RUN_ID
              and .conclusion != "cancelled" and .conclusion != "skipped")] | length')"
          echo "Runs today before this one: $runs (cap $DAILY_CAP)"
          if [ "$runs" -ge "$DAILY_CAP" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  claude:
    needs: cap
    if: needs.cap.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
      pull-requests: read # read the diff and the description
    steps:
      # Records every host this job connects to (rule 9). After a week of records the list
      # becomes a limit.
      - name: Watch where this job connects
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # Without these two the checkout below would fall back to the pull request's code.
      - name: Make sure this workflow knows its own commit
        env:
          WORKFLOW_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPO" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty"
            exit 1
          fi
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pull request could commit .kitden-sdlc as a link; checkout would follow it.
      - name: Clear the plugin folder
        run: rm -rf .kitden-sdlc
      # This workflow's own repository, at the commit this workflow file comes from.
      # `job.workflow_*` names the called workflow, not the caller.
      - name: Check out kitden-sdlc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .kitden-sdlc
          persist-credentials: false
      - name: Collect the files to review
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: .kitden-sdlc/scripts/prepare_review.sh "$PR_NUMBER" "$BASE_REF"
      # Claude would read CLAUDE.md files and .claude folders the pull request adds in
      # subfolders; the root ones are put back from the base branch by the action.
      - name: Remove the pull request's nested Claude files
        if: steps.prepare.outputs.skip != 'true'
        run: >-
          find . \( -path ./.git -o -path ./.review -o -path ./.kitden-sdlc
          -o -path ./.claude -o -path ./CLAUDE.md \) -prune
          -o \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name .claude \)
          -print -prune -exec rm -rf {} +
      # A failed reviewer does not fail the job: the review comment says it gave no answer.
      # The step's own timeout, under the job's, makes a hang a failed step, not a failed job.
      - name: Review
        id: review
        if: steps.prepare.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 12
        uses: anthropics/claude-code-action@9eb012b6d0900c2b9eede65ee1758cec4d2973e9 # v1.0.270
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ github.token }}
          prompt: /kitden-sdlc:review-kitden
          claude_args: >-
            --model ${{ inputs.model }}
            --effort high
            --max-turns ${{ inputs.max_turns }}
            --plugin-dir .kitden-sdlc/plugins/kitden-sdlc
            --allowedTools "Read(./**),Edit(./.review/**)"
            --disallowedTools "Bash,WebFetch,WebSearch,NotebookEdit,Task,Read(**/.git/**),Read(**/.kitden-sdlc/**),Read(~/.*),Read(~/.*/**),Read(//proc/**)"
      - name: Say that Claude failed
        if: steps.review.outcome == 'failure'
        run: echo "::warning::The Claude reviewer failed; the review comment says who gave no answer."
      - name: Keep the findings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-claude
          path: .review/findings.json
          include-hidden-files: true
          if-no-files-found: ignore

  luna:
    needs: cap
    if: needs.cap.outputs.skip != 'true'
    # Not ubuntu-latest: on the ubuntu26 image the action's drop-sudo step fails before the
    # model runs (openai/codex-action#188). Back to ubuntu-latest once that is fixed.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
      pull-requests: read # read the diff and the description
    steps:
      # Records every host this job connects to (rule 9). After a week of records the list
      # becomes a limit.
      - name: Watch where this job connects
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # Without these two the checkout below would fall back to the pull request's code.
      - name: Make sure this workflow knows its own commit
        env:
          WORKFLOW_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPO" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty"
            exit 1
          fi
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pull request could commit .kitden-sdlc as a link; checkout would follow it.
      - name: Clear the plugin folder
        run: rm -rf .kitden-sdlc
      # This workflow's own repository, at the commit this workflow file comes from.
      # `job.workflow_*` names the called workflow, not the caller.
      - name: Check out kitden-sdlc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .kitden-sdlc
          persist-credentials: false
      - name: Collect the files to review
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: .kitden-sdlc/scripts/prepare_review.sh "$PR_NUMBER" "$BASE_REF"
      # Codex reads AGENTS.md, .agents and .codex files from the checkout as its own
      # instructions. The pull request controls them, so delete them. The base branch's
      # AGENTS.md is in .review, and the pull request's change is in .review/diff.patch.
      - name: Remove the pull request's agent instructions
        if: steps.prepare.outputs.skip != 'true'
        run: |
          rm -rf AGENTS.md AGENTS.override.md .agents .codex
          find . \( -path ./.git -o -path ./.review -o -path ./.kitden-sdlc \) -prune -o \( -name AGENTS.md -o -name AGENTS.override.md \) \( -type f -o -type l \) -print -exec rm -f {} +
      # The action drops sudo for the rest of the job.
      # `drop-sudo` (the default) keeps the OpenAI key out of the model's reach; the
      # read-only profile means no writes and no network, so the action itself writes
      # the final message to the findings file. Web search is off. The earlier step deletes the pull
      # request's agent files, and project_doc_max_bytes=0 asks Codex to read no
      # project instructions as well.
      # A failed reviewer does not fail the job: the review comment says it gave no answer.
      # The step's own timeout, under the job's, makes a hang a failed step, not a failed job.
      - name: Review
        id: luna
        if: steps.prepare.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 12
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        with:
          openai-api-key: ${{ secrets.openai_api_key }}
          codex-version: "0.167.0"
          model: gpt-6-luna
          prompt-file: .kitden-sdlc/prompts/review-luna.md
          output-schema-file: .kitden-sdlc/schemas/findings.openai.schema.json
          output-file: .review/findings.json
          permission-profile: ":read-only"
          codex-args: '["-c", "project_doc_max_bytes=0", "-c", "web_search=\"disabled\""]'
      - name: Say that Luna failed
        if: steps.luna.outcome == 'failure'
        run: echo "::warning::The Luna reviewer failed; the review comment says who gave no answer."
      # Luna's answer, or the too-large notice the script wrote. A job output would not
      # do: GitHub drops an output that looks like it holds a secret.
      - name: Keep the findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-luna
          path: .review/findings.json
          include-hidden-files: true
          if-no-files-found: ignore

  # No model here: this job only turns the two findings files into one comment. The app's
  # key is used by one step, to get a short-lived token that can only write to pull requests.
  post:
    needs: [cap, claude, luna]
    # With continue-on-error, success here means the job ended, not that the reviewer
    # answered; post_findings.py tells the two apart.
    if: >-
      !cancelled() && needs.cap.outputs.skip == 'false'
      && (needs.claude.result == 'success' || needs.luna.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # compare the last reviewed commit with this one
      pull-requests: write # post the comment
    steps:
      # Without these two the checkout below would fall back to the pull request's code.
      - name: Make sure this workflow knows its own commit
        env:
          WORKFLOW_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPO" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty"
            exit 1
          fi
      - name: Check out kitden-sdlc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      # No file means that reviewer wrote nothing; post_findings.py then says so.
      - name: Get Claude's findings
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: findings-claude
          path: claude
      - name: Get Luna's findings
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: findings-luna
          path: luna
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.10"
      # If the app is not installed this step fails, and the job's own token posts instead.
      - name: Sign in as the review app
        id: app
        if: inputs.app_client_id != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          permission-pull-requests: write
      # Git objects only, never a checkout: post_findings.py looks up quoted strings in them.
      # The base commit too: the reviewers' checkout is the merge, so they read its files.
      - name: Get the pull request's commit
        continue-on-error: true
        env:
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git init -q "$RUNNER_TEMP/pr"
          git -C "$RUNNER_TEMP/pr" fetch -q --depth=1 \
            "https://x-access-token:${GH_READ_TOKEN}@github.com/${REPO}.git" "$HEAD_SHA" "$BASE_SHA"
      # The comment keeps the findings of earlier runs. GH_READ_TOKEN compares the commit
      # the last run reviewed with this one, to tell which of them were fixed since; the
      # app's token may only write to pull requests.
      - name: Post the review
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CLAUDE_MODEL: ${{ inputs.model }}
        run: >-
          uv run --no-project python scripts/post_findings.py
          --claude claude/findings.json --luna luna/findings.json
          --claude-model "$CLAUDE_MODEL"
          --repo "$REPO" --pr "$PR_NUMBER" --head-sha "$HEAD_SHA"
          --tree "$RUNNER_TEMP/pr" --base-sha "$BASE_SHA"
