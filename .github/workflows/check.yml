name: Check agent workflows

# Reusable workflow: checks the calling repository's workflow files with zizmor,
# actionlint and the agent-workflow rules. Needs no inputs or secrets.

on:
  workflow_call:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
    steps:
      # Without these two the checkout below would fall back to the pull request's code.
      - name: Make sure this workflow knows its own commit
        env:
          WORKFLOW_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPO" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty"
            exit 1
          fi
      # The pull request's files are untrusted: only the pinned tools and the
      # kitden-agents script run on them, never anything the pull request brings.
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pull request could commit .kitden-agents as a link; checkout would follow it.
      - name: Clear the tools folder
        run: rm -rf .kitden-agents
      # This workflow's own repository, at the commit this workflow file comes from.
      # `job.workflow_*` names the called workflow, not the caller.
      - name: Check out kitden-agents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .kitden-agents
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.10"
          enable-cache: false
      # The first --no-config: a uv.toml in the pull request must not change where uv
      # installs from. The second, with --no-ignores: .github/zizmor.yml and ignore
      # comments in the pull request must not hide findings.
      - name: zizmor
        run: uvx --no-config zizmor==1.32.0 --no-config --no-ignores .github/workflows
      # Our empty settings file, because .github/actionlint.yaml in the pull request
      # could ignore errors. It sits in the folder mounted below.
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -config-file .kitden-agents/config/actionlint.yaml
      - name: Agent workflow rules
        run: >-
          uv run --no-project --no-config --with pyyaml
          python .kitden-agents/scripts/check_agent_workflows.py .github/workflows
