# What: once a day, with no model, opens or updates an issue in Kitden when a release is due or
# a store is behind.
# Why: so that merged work does not sit unreleased, and a release that reached only some stores
# is noticed.
#
# Reusable workflow: once a day, two facts become issues in Kitden. No model runs here.
#   "Time for a release?"          while merged changes to src/, plugins/ or install.* wait
#   "Release vX.Y.Z is not everywhere"  while a store is behind or different
# An issue is updated in place and closes itself when it no longer holds. The issues are posted
# by the Lantern app, with a token that can write issues in Kitden and nothing else.
# The decisions are in scripts/release_watch.py; the design is
# docs/superpowers/specs/2026-11-12-release-flow-design.md (A7).
name: Release watch

on:
  workflow_call:
    inputs:
      # The Lantern app, which posts the issues under its own name.
      app_client_id:
        type: string
        required: true
    secrets:
      app_private_key:
        required: true

permissions: {}

# One run at a time: two runs would race to open the same issue.
concurrency:
  group: release-watch
  cancel-in-progress: false

jobs:
  watch:
    if: vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {} # the reads are public; the app token writes the issues
    steps:
      - name: Make sure this workflow knows its own commit
        env:
          WORKFLOW_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPO" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty"
            exit 1
          fi
      - name: Check out kitden-sdlc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .kitden-sdlc
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.10"
          enable-cache: false
      - name: Sign in as the Lantern app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: KonstantinStarovoytov
          repositories: kitden
          permission-issues: write
      - name: Say what is due
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }} # the issues; the script reads public data only
          GITHUB_TOKEN: ${{ github.token }} # lifts the rate limit on api.github.com reads
        run: uv run --no-config --no-project python .kitden-sdlc/scripts/release_watch.py
