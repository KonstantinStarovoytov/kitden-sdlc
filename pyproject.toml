[project]
name = "kitden-sdlc"
version = "0.1.0"
description = "AI reviewers, a client watcher and a release flow for Kitden, with rules so no agent job holds untrusted text, a secret and write access at once."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "pyyaml>=6",
    {include-group = "watch"},
]
watch = [
    "anthropic>=2.8.0",
    "langchain-openai>=1.7.4",
    "langfuse>=5.2.0",
    "langgraph>=1.2.20",
]
watch-io = [
    "pyyaml>=6",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["scripts", "evals", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "evals"]
